dataset: ettm2
shared:
  model_config: DiffDiff
  condition: fcst
  label_len: 48
  batch_size: 64
  n_sample: 100
  ddim_steps: 10
  pred_lens: [96, 192, 336, 720]

train_args:
  d_model: 96
  d_mlp: 384
  n_layers: 2
  dropout: 0.3
  lr: 1.0e-4
  lr_sched: warmup_cosine
  warmup_ratio: 0.05
  min_lr_ratio: 0.01
  early_stop: 8
  gate_init_bias: -2
  gate_l1_weight: 1.0e-2
  norm_source: target
  label_replace: none

sample_args:
  deterministic: true
  w_cond: 1.0

expected:
  H96:  {MSE: 0.0646, MAE: 0.1846, CRPS: 0.0763, MSE_std: 0.0005, MAE_std: 0.0010, CRPS_std: 0.0004}
  H192: {MSE: 0.0981, MAE: 0.2340, CRPS: 0.0955, MSE_std: 0.0010, MAE_std: 0.0021, CRPS_std: 0.0007}
  H336: {MSE: 0.1308, MAE: 0.2758, CRPS: 0.1120, MSE_std: 0.0036, MAE_std: 0.0031, CRPS_std: 0.0016}
  H720: {MSE: 0.1781, MAE: 0.3257, CRPS: 0.1322, MSE_std: 0.0032, MAE_std: 0.0029, CRPS_std: 0.0013}
