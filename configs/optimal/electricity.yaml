dataset: electricity
shared:
  model_config: DiffDiff
  condition: fcst
  label_len: 48
  batch_size: 64
  n_sample: 100
  ddim_steps: 10
  pred_lens: [96, 192, 336, 720]

train_args:
  d_model: 64
  d_mlp: 256
  n_layers: 3
  dropout: 0.1
  lr: 2.0e-4
  lr_sched: cosine
  min_lr_ratio: 0.01
  grad_clip: 0.5
  early_stop: 8
  gate_init_bias: 0
  gate_l1_weight: 1.0e-4
  norm_source: target
  label_replace: none

sample_args:
  deterministic: true
  w_cond: 1.0

expected:
  H96:  {MSE: 0.2808, MAE: 0.3665, CRPS: 0.1535, MSE_std: 0.0088, MAE_std: 0.0038, CRPS_std: 0.0020}
  H192: {MSE: 0.3078, MAE: 0.3834, CRPS: 0.1597, MSE_std: 0.0057, MAE_std: 0.0027, CRPS_std: 0.0016}
  H336: {MSE: 0.3476, MAE: 0.4099, CRPS: 0.1701, MSE_std: 0.0062, MAE_std: 0.0025, CRPS_std: 0.0013}
  H720: {MSE: 0.4308, MAE: 0.4717, CRPS: 0.1966, MSE_std: 0.0218, MAE_std: 0.0108, CRPS_std: 0.0055}
