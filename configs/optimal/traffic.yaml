dataset: traffic
shared:
  model_config: DiffDiff
  condition: fcst
  label_len: 48
  batch_size: 64
  n_sample: 100
  ddim_steps: 10
  pred_lens: [96, 192, 336, 720]

train_args:
  d_model: 96
  d_mlp: 384
  n_layers: 3
  dropout: 0.1
  lr: 4.0e-4
  lr_sched: cosine
  min_lr_ratio: 0.01
  grad_clip: 5.0
  early_stop: 15
  gate_init_bias: -3
  gate_l1_weight: 1.0e-2
  norm_source: target
  label_replace: none

sample_args:
  deterministic: false
  sigma_schedule: high
  w_cond: 1.0

expected:
  H96:  {MSE: 0.1477, MAE: 0.2217, CRPS: 0.0981, MSE_std: 0.0012, MAE_std: 0.0014, CRPS_std: 0.0009}
  H192: {MSE: 0.1447, MAE: 0.2211, CRPS: 0.0977, MSE_std: 0.0011, MAE_std: 0.0021, CRPS_std: 0.0010}
  H336: {MSE: 0.1412, MAE: 0.2205, CRPS: 0.0968, MSE_std: 0.0012, MAE_std: 0.0007, CRPS_std: 0.0003}
  H720: {MSE: 0.1561, MAE: 0.2362, CRPS: 0.1045, MSE_std: 0.0008, MAE_std: 0.0013, CRPS_std: 0.0005}
